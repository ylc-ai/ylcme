# Netlify 部署配置
# 把整个项目目录拖到 https://app.netlify.com/drop 即可一键部署
# 下面是自定义部署时的配置（一般用不到，直接拖拽更简单）

[build]
  publish = "."

# 资源 MIME 类型修正（保险起见）
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
